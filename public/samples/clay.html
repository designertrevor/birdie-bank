<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#fffaf0">
<title>Birdie Bank — Clay style</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--canvas:#fffaf0;--card:#f5f0e0;--ink:#0a0a0a;--mute:#6a6a6a;--pink:#ff4d8b;--teal:#1a3a3a;--lav:#b8a4ed;--peach:#ffb084;--ochre:#e8b94a;--mint:#a4d4c5;--coral:#ff6b5a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--canvas);overscroll-behavior:none}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.d{font-family:"Bricolage Grotesque",sans-serif}
.scroll{flex:1;overflow-y:auto;padding:16px 16px 24px}
h1{font-size:40px;font-weight:800;letter-spacing:-.03em}
.hero{margin-top:16px;background:var(--teal);color:#fff;border-radius:28px;padding:22px;position:relative;overflow:hidden;min-height:190px;animation:pop .55s cubic-bezier(.3,1.5,.5,1) both}
.hero small{font-size:14px;color:var(--mint);font-weight:500}
.big{font-size:76px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;background:var(--ochre);color:var(--ink);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;margin-right:6px;transform:rotate(-2deg)}
.chip+.chip{background:var(--pink);color:#fff;transform:rotate(2deg)}
.blob{position:absolute;right:-20px;bottom:-24px;width:150px;animation:float 3s ease-in-out infinite}
h2{font-size:24px;font-weight:800;margin:28px 2px 12px;letter-spacing:-.02em}
.card{border-radius:22px;padding:18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.5,.5,1);animation:rise .5s cubic-bezier(.3,1.3,.5,1) both}
.card:active{transform:scale(.96) rotate(-1deg)}
.list .card:nth-of-type(1){background:var(--peach)}.list .card:nth-of-type(2){background:var(--lav);animation-delay:.08s}.list .card:nth-of-type(3){background:var(--mint);animation-delay:.16s}
.course{font-size:19px;font-weight:800}.sub{font-size:13px;color:rgba(0,0,0,.6);margin-top:3px}
.amt{font-size:26px;font-weight:800;letter-spacing:-.03em}
.nav{display:flex;align-items:center;justify-content:space-around;padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.nb{background:none;border:0;font:500 12px Inter;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}.nb.on{color:var(--ink)}.nb b{font-size:20px}
.play{background:var(--ink);color:#fff;border:0;font:800 17px "Bricolage Grotesque";padding:16px 26px;border-radius:999px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.play:active{transform:scale(.92)}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px) scale(.9);background:var(--pink);color:#fff;font:800 16px "Bricolage Grotesque";padding:12px 20px;border-radius:999px;opacity:0;transition:.3s cubic-bezier(.3,1.6,.5,1)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}}@keyframes rise{from{transform:translateY(20px) scale(.96);opacity:0}}@keyframes float{50%{transform:translateY(-8px) rotate(4deg)}}
</style></head><body>
<div class="scroll">
  <h1 class="d">History</h1>
  <div class="hero">
    <!-- chunky clay-style golf ball on tee -->
    <svg class="blob" viewBox="0 0 150 150">
      <defs><radialGradient id="g" cx="35%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9d2bd"/></radialGradient></defs>
      <path d="M62 110 L75 150 L88 110Z" fill="#ff6b5a"/>
      <circle cx="75" cy="70" r="46" fill="url(#g)"/>
      <g fill="rgba(0,0,0,.08)"><circle cx="58" cy="52" r="5"/><circle cx="80" cy="44" r="5"/><circle cx="98" cy="62" r="5"/><circle cx="66" cy="76" r="5"/><circle cx="88" cy="86" r="5"/><circle cx="54" cy="96" r="5"/></g>
    </svg>
    <small>This season</small>
    <div class="big d" data-count="34">+$0</div>
    <span class="chip">🔥 2 in a row</span><span class="chip">7 birdies</span>
  </div>
  <h2 class="d">Recent rounds</h2>
  <div class="list">
  <div class="card" onclick="toast('Round detail — soon!')"><div><div class="course d">Birch Creek</div><div class="sub">Mar 27 · Banker · 9 holes</div></div><div class="amt d">+$11</div></div>
  <div class="card" onclick="toast('Round detail — soon!')"><div><div class="course d">Pebble Creek</div><div class="sub">Mar 20 · Banker · 18 holes</div></div><div class="amt d">−$8</div></div>
  <div class="card" onclick="toast('Round detail — soon!')"><div><div class="course d">Logan River</div><div class="sub">Mar 18 · Banker · 18 holes</div></div><div class="amt d">+$31</div></div>
</div>
</div>
<nav class="nav">
  <button class="nb on"><b>◷</b>History</button>
  <button class="play" onclick="burst(this,['#ff4d8b','#e8b94a','#b8a4ed','#a4d4c5','#ffb084']);toast('Let\'s gooo ⛳')">Start a round</button>
  <button class="nb"><b>⚙︎</b>Settings</button>
</nav>
<script>
// Shared playful bits for the style samples
(function () {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Count-up for [data-count] numbers
  document.querySelectorAll('[data-count]').forEach(el => {
    const end = +el.dataset.count, sign = end >= 0 ? '+' : '−', abs = Math.abs(end);
    if (reduce) { el.textContent = sign + '$' + abs; return; }
    const t0 = performance.now(), dur = 900;
    (function tick(t) {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = sign + '$' + Math.round(abs * e);
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  });

  // Confetti burst from an element
  window.burst = function (from, colors) {
    if (reduce) return;
    const r = from.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let i = 0; i < 28; i++) {
      const c = document.createElement('i');
      const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 110;
      c.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;width:8px;height:${6 + Math.random() * 8}px;
        background:${colors[i % colors.length]};border-radius:2px;pointer-events:none;z-index:999;`;
      document.body.appendChild(c);
      c.animate([
        { transform: 'translate(-50%,-50%) rotate(0)', opacity: 1 },
        { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d - 40}px) rotate(${Math.random() * 540}deg)`, opacity: 1, offset: .7 },
        { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 60}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
      ], { duration: 900 + Math.random() * 400, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => c.remove();
    }
  };

  // Toast
  window.toast = function (msg) {
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800);
  };
})();
</script>
</body></html>
