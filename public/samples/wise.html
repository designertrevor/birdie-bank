<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#e2f6d5">
<title>Birdie Bank — Wise style</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--lime:#9fe870;--lime-pale:#e2f6d5;--ink:#0e0f0c;--forest:#163300;--body:#454745;--mute:#868685;--sage:#e8ebe6;--red:#d03238}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--lime-pale);overscroll-behavior:none}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 0}
.scroll{flex:1;overflow-y:auto;padding:12px 16px 24px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0 20px}
.hello{font-weight:600;color:var(--forest)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--forest);color:var(--lime);display:grid;place-items:center;font-weight:900}
.hero{background:var(--forest);color:#fff;border-radius:32px;padding:24px;position:relative;overflow:hidden;animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
.hero small{font-size:14px;font-weight:600;color:var(--lime)}
.big{font-size:72px;font-weight:900;letter-spacing:-.04em;line-height:.95;margin:6px 0 14px;color:var(--lime);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(159,232,112,.16);color:var(--lime);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px}
.hero svg{position:absolute;right:-10px;top:10px;width:86px;animation:sway 3s ease-in-out infinite;transform-origin:30% 100%}
h2{font-size:28px;font-weight:900;letter-spacing:-.03em;margin:28px 4px 12px}
.card{background:#fff;border-radius:24px;padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:10px;cursor:pointer;
  transition:transform .15s;animation:rise .5s cubic-bezier(.2,.8,.3,1) both}
.card:active{transform:scale(.97)}
.list .card:nth-of-type(2){animation-delay:.08s}.list .card:nth-of-type(3){animation-delay:.16s}
.flag{width:48px;height:48px;border-radius:50%;background:var(--sage);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.meta{flex:1;min-width:0}.course{font-weight:700;font-size:16px}.sub{font-size:13px;color:var(--mute);margin-top:2px}
.amt{font-weight:900;font-size:20px;letter-spacing:-.02em}.amt.up{color:var(--forest);background:var(--lime);padding:4px 10px;border-radius:999px}.amt.down{color:var(--red)}
.nav{display:flex;align-items:center;justify-content:space-around;background:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0}
.nb{background:none;border:0;font:600 12px Inter;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px}
.nb.on{color:var(--ink)}.nb b{font-size:20px}
.play{background:var(--lime);color:var(--forest);border:0;font:900 17px Inter;padding:16px 28px;border-radius:999px;transition:transform .15s;box-shadow:0 6px 0 var(--forest)}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--forest)}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:var(--lime);font-weight:700;padding:12px 20px;border-radius:999px;opacity:0;transition:.25s cubic-bezier(.3,1.4,.5,1)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes pop{from{transform:scale(.9);opacity:0}}@keyframes rise{from{transform:translateY(16px);opacity:0}}
@keyframes sway{50%{transform:rotate(6deg)}}
</style></head><body>
<div class="scroll">
  <div class="top"><span class="hello">Morning, Trevor</span><div class="avatar">T</div></div>
  <div class="hero">
    <svg viewBox="0 0 100 120"><rect x="28" y="10" width="4" height="100" rx="2" fill="#9fe870"/><path d="M32 12 L82 26 L32 42Z" fill="#9fe870"/><ellipse cx="30" cy="112" rx="26" ry="6" fill="rgba(159,232,112,.25)"/></svg>
    <small>This season</small>
    <div class="big" data-count="34">+$0</div>
    <div class="chips"><span class="chip">🔥 2-round win streak</span><span class="chip">7 birdies</span></div>
  </div>
  <h2>Recent rounds</h2>
  <div class="list">
  <div class="card" onclick="toast('Round detail — coming soon')"><div class="flag">⛳</div><div class="meta"><div class="course">Birch Creek GC</div><div class="sub">Mar 27 · Banker · 9 holes</div></div><div class="amt up">+$11</div></div>
  <div class="card" onclick="toast('Round detail — coming soon')"><div class="flag">🏌️</div><div class="meta"><div class="course">Pebble Creek GC</div><div class="sub">Mar 20 · Banker · 18 holes</div></div><div class="amt down">−$8</div></div>
  <div class="card" onclick="toast('Round detail — coming soon')"><div class="flag">🐦</div><div class="meta"><div class="course">Logan River GC</div><div class="sub">Mar 18 · Banker · 18 holes</div></div><div class="amt up">+$31</div></div>
</div>
</div>
<nav class="nav">
  <button class="nb on"><b>◷</b>History</button>
  <button class="play" onclick="burst(this,['#9fe870','#163300','#fff']);toast('Tee it up! ⛳')">Start a round</button>
  <button class="nb"><b>⚙︎</b>Settings</button>
</nav>
<script>
// Shared playful bits for the style samples
(function () {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Count-up for [data-count] numbers
  document.querySelectorAll('[data-count]').forEach(el => {
    const end = +el.dataset.count, sign = end >= 0 ? '+' : '−', abs = Math.abs(end);
    if (reduce) { el.textContent = sign + '$' + abs; return; }
    const t0 = performance.now(), dur = 900;
    (function tick(t) {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = sign + '$' + Math.round(abs * e);
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  });

  // Confetti burst from an element
  window.burst = function (from, colors) {
    if (reduce) return;
    const r = from.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let i = 0; i < 28; i++) {
      const c = document.createElement('i');
      const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 110;
      c.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;width:8px;height:${6 + Math.random() * 8}px;
        background:${colors[i % colors.length]};border-radius:2px;pointer-events:none;z-index:999;`;
      document.body.appendChild(c);
      c.animate([
        { transform: 'translate(-50%,-50%) rotate(0)', opacity: 1 },
        { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d - 40}px) rotate(${Math.random() * 540}deg)`, opacity: 1, offset: .7 },
        { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 60}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
      ], { duration: 900 + Math.random() * 400, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => c.remove();
    }
  };

  // Toast
  window.toast = function (msg) {
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800);
  };
})();
</script>
</body></html>
