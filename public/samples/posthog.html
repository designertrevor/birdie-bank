<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#eeefe9">
<title>Birdie Bank — PostHog style</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--canvas:#eeefe9;--card:#fff;--ink:#23251d;--body:#4d4f46;--mute:#6c6e63;--line:#bfc1b7;--gold:#f7a501;--gold-d:#b17816;--green:#2c8c66;--green-s:#d9eddf;--red:#cd4239;--red-s:#f7d6d3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--canvas);overscroll-behavior:none}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--body);-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.scroll{flex:1;overflow-y:auto;padding:16px 16px 24px}
h1{font-size:32px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.hand{font-family:Caveat,cursive;color:var(--gold-d);font-size:22px;transform:rotate(-3deg);display:inline-block}
.hero{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;gap:12px;align-items:center;animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
.hero .mascot{width:96px;flex-shrink:0;animation:bob 2.4s ease-in-out infinite}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.big{font-size:52px;font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--green-s);color:var(--green);margin-right:4px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 2px 10px}
.sec h2{font-size:20px;font-weight:800;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  box-shadow:0 3px 0 var(--line);transition:transform .12s, box-shadow .12s;animation:rise .45s ease-out both}
.card:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.list .card:nth-of-type(2){animation-delay:.07s}.list .card:nth-of-type(3){animation-delay:.14s}
.course{font-weight:700;color:var(--ink)}.sub{font-size:13px;color:var(--mute);margin-top:2px}
.amt{font-weight:800;font-size:15px;padding:4px 10px;border-radius:6px}.up{background:var(--green-s);color:var(--green)}.down{background:var(--red-s);color:var(--red)}
.nav{display:flex;align-items:center;justify-content:space-around;border-top:1px solid var(--line);background:var(--canvas);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nb{background:none;border:0;font:600 12px "IBM Plex Sans";color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}.nb.on{color:var(--ink)}.nb b{font-size:20px}
.play{background:var(--gold);color:var(--ink);border:0;font:800 16px "IBM Plex Sans";padding:14px 24px;border-radius:8px;box-shadow:0 4px 0 var(--gold-d);transition:.12s}
.play:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px) rotate(-2deg);background:var(--ink);color:#fff;font-weight:600;padding:10px 16px;border-radius:6px;opacity:0;transition:.25s cubic-bezier(.3,1.4,.5,1)}
.toast.show{opacity:1;transform:translate(-50%,0) rotate(-2deg)}
@keyframes pop{from{transform:scale(.92);opacity:0}}@keyframes rise{from{transform:translateY(14px);opacity:0}}@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
</style></head><body>
<div class="scroll">
  <h1>History</h1>
  <span class="hand">you're on a heater →</span>
  <div class="hero">
    <!-- golf-ball mascot -->
    <svg class="mascot" viewBox="0 0 100 110">
      <ellipse cx="50" cy="104" rx="28" ry="5" fill="#dcdfd2"/>
      <path d="M40 96 L50 70 L60 96Z" fill="#f7a501" stroke="#23251d" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="50" cy="44" r="34" fill="#fff" stroke="#23251d" stroke-width="3"/>
      <g fill="#dcdfd2"><circle cx="30" cy="30" r="3"/><circle cx="68" cy="26" r="3"/><circle cx="72" cy="56" r="3"/><circle cx="28" cy="58" r="3"/><circle cx="50" cy="20" r="3"/></g>
      <circle cx="40" cy="42" r="4" fill="#23251d"/><circle cx="60" cy="42" r="4" fill="#23251d"/>
      <path d="M40 54 Q50 64 60 54" stroke="#23251d" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M22 16 Q30 4 44 10 L40 18 Q30 14 26 22Z" fill="#cd4239" stroke="#23251d" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>
    <div><div class="lbl">Season winnings</div><div class="big" data-count="34">+$0</div><span class="pill">🔥 2 in a row</span><span class="pill">7 birdies</span></div>
  </div>
  <div class="sec"><h2>Recent rounds</h2><span class="hand" style="font-size:18px">3 this month</span></div>
  <div class="list">
  <div class="card" onclick="toast('Round detail — coming soon')"><div><div class="course">Birch Creek GC</div><div class="sub">Mar 27 · Banker · 9 holes · 4 players</div></div><span class="amt up">+$11</span></div>
  <div class="card" onclick="toast('Round detail — coming soon')"><div><div class="course">Pebble Creek GC</div><div class="sub">Mar 20 · Banker · 18 holes · 3 players</div></div><span class="amt down">−$8</span></div>
  <div class="card" onclick="toast('Round detail — coming soon')"><div><div class="course">Logan River GC</div><div class="sub">Mar 18 · Banker · 18 holes · 4 players</div></div><span class="amt up">+$31</span></div>
</div>
</div>
<nav class="nav">
  <button class="nb on"><b>◷</b>History</button>
  <button class="play" onclick="burst(this,['#f7a501','#2c8c66','#cd4239','#2c84e0']);toast('Grab your clubs 🏌️')">Start a round</button>
  <button class="nb"><b>⚙︎</b>Settings</button>
</nav>
<script>
// Shared playful bits for the style samples
(function () {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Count-up for [data-count] numbers
  document.querySelectorAll('[data-count]').forEach(el => {
    const end = +el.dataset.count, sign = end >= 0 ? '+' : '−', abs = Math.abs(end);
    if (reduce) { el.textContent = sign + '$' + abs; return; }
    const t0 = performance.now(), dur = 900;
    (function tick(t) {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = sign + '$' + Math.round(abs * e);
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  });

  // Confetti burst from an element
  window.burst = function (from, colors) {
    if (reduce) return;
    const r = from.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let i = 0; i < 28; i++) {
      const c = document.createElement('i');
      const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 110;
      c.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;width:8px;height:${6 + Math.random() * 8}px;
        background:${colors[i % colors.length]};border-radius:2px;pointer-events:none;z-index:999;`;
      document.body.appendChild(c);
      c.animate([
        { transform: 'translate(-50%,-50%) rotate(0)', opacity: 1 },
        { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d - 40}px) rotate(${Math.random() * 540}deg)`, opacity: 1, offset: .7 },
        { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 60}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
      ], { duration: 900 + Math.random() * 400, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => c.remove();
    }
  };

  // Toast
  window.toast = function (msg) {
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800);
  };
})();
</script>
</body></html>
