<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f2e4">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1413">
<meta name="description" content="Is Birdie Bank up right now? A live check of the app, live scoring, sign-in, course search and notifications.">
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Status · Birdie Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/status.css">
<script src="/status.js"></script>
</head>
<body>
<div class="edge-top" aria-hidden="true"></div>
<div class="edge-bottom" aria-hidden="true"></div>
<main>
  <a class="back" href="/">Birdie Bank</a>
  <h1>Status</h1>
  <section class="summary" id="summary" data-tone="wait" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <div>
      <p class="summary-text" id="summary-text">Checking…</p>
      <p class="summary-sub" id="summary-sub"></p>
    </div>
  </section>
  <ul class="checks" id="checks" aria-label="What was checked"></ul>
  <noscript><p class="note">This page checks each service from your phone, so it needs JavaScript on.</p></noscript>
  <button class="again" id="again" type="button">Check again</button>
  <p class="note">Each line is checked from this phone, right now, so it also shows whether your signal reaches us. Green is working, amber is slow or switched off, grey didn’t answer in 5 seconds.</p>
  <p class="foot"><a href="/">Open the app</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></p>
</main>
</body>
</html>
